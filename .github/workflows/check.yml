name: BTCTurk Sinyal Kontrolü

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Piyasayı kontrol et ve gerekirse bildirim gönder
        run: python check_signal.py

      - name: Durumu kaydet
        run: |
          git config user.name "btc-sinyal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Sinyal durumu güncellendi"
          git push
